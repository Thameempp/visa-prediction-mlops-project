model_selection:
  model:
    RandomForestClassifier:
      search_param_grid:
        n_estimators:
          - 100
          - 200
        max_depth:
          - 8
          - 16
          - null
        min_samples_split:
          - 2
          - 5
    XGBClassifier:
      search_param_grid:
        n_estimators:
          - 100
          - 200
        max_depth:
          - 3
          - 5
        learning_rate:
          - 0.05
          - 0.1
    KNeighborsClassifier:
      search_param_grid:
        n_neighbors:
          - 3
          - 5
          - 7
        weights:
          - uniform
          - distance
